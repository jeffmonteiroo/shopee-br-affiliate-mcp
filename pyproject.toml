[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-affiliate-mcp"
version = "0.5.0"
description = "Shopee Brazil Affiliate MCP: offers, feeds, links and commission reports"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["mcp==1.21.1", "httpx==0.28.1", "jsonschema==4.25.1", "uvicorn==0.38.0", "cryptography==50.0.2"]

[project.scripts]
shopee-affiliate-mcp = "shopee_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shopee_mcp = ["*.json"]
